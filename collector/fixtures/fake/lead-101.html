<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lead fake-101</title></head>
<body>
  <dl id="lead">
    <dt>Name</dt><dd data-field="name">Sample Person</dd>
    <dt>Email</dt><dd data-field="email">sample.person@example.com</dd>
    <dt>Phone</dt><dd data-field="phone">(202) 555-0100</dd>
    <dt>Event date</dt><dd data-field="eventDate">2026-11-14</dd>
    <dt>Guests</dt><dd data-field="guestCount">80</dd>
    <dt>Location</dt><dd data-field="location">Washington, DC</dd>
    <dt>Event type</dt><dd data-field="eventType">Wedding</dd>
    <dt>Budget</dt><dd data-field="budget">$12,000</dd>
    <dt>Message</dt><dd data-field="message">Plated dinner for 80.</dd>
  </dl>
</body></html>
