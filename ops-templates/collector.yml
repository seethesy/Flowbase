# Lead collector (FLOW-102, ADR-14, ADR-26).
# TEMPLATE: copy this file to .github/workflows/collector.yml in the private ops
# repo. It does nothing in the Flowbase repo. Secrets are referenced by name only
# (collector/README.md lists them); their values live in the ops repo's Actions
# secrets.
name: Flowbase lead collector
on:
  schedule:
    # GitHub cron is UTC. 8am–8pm New York is 12:00–00:00 UTC in daylight time and
    # 13:00–01:00 UTC in winter, so this fires hourly across both; the script runs
    # only at 8am, 10am, … 8pm New York time and exits at once otherwise.
    - cron: "0 0,1,12-23 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flowbase-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ops-v1 is a tag the developer moves after reviewing script changes
      # (FLOW-175); see collector/README.md → Ops repo setup.
      - name: Check out Flowbase ops-v1 (read-only)
        uses: actions/checkout@v4
        with:
          repository: seethesy/Flowbase
          ref: ops-v1
          path: flowbase
          # Flowbase is public (ADR-27), so the ops repo's own token can read it;
          # FLOWBASE_READ_TOKEN is optional and used when set.
          token: ${{ secrets.FLOWBASE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Report account-wide Actions minutes
        env:
          GITHUB_BILLING_TOKEN: ${{ secrets.GITHUB_BILLING_TOKEN }}
          FLOWBASE_URL: ${{ secrets.FLOWBASE_URL }}
          INGEST_TOKEN_LEADS: ${{ secrets.INGEST_TOKEN_LEADS }}
        run: |
          if [ -z "$GITHUB_BILLING_TOKEN" ]; then
            echo "GITHUB_BILLING_TOKEN is not configured; skipping usage report."
            exit 0
          fi
          year=$(date -u +%Y)
          month=$(date -u +%-m)
          period=$(date -u +%Y-%m)
          report=$(curl -fsS -H "Authorization: Bearer $GITHUB_BILLING_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/users/${{ github.repository_owner }}/settings/billing/usage/summary?year=$year&month=$month")
          minutes=$(jq -e '[.usageItems[] | select(.product == "Actions" and .unitType == "minutes") | .grossQuantity] | add // 0' <<< "$report")
          jq -n --arg period "$period" --argjson minutes "$minutes" \
            '{sourceRecordId: ($period + ":" + ($minutes | tostring)), period: $period, minutes: $minutes}' \
            | curl -fsS -X POST -H "Authorization: Bearer $INGEST_TOKEN_LEADS" \
              -H "Content-Type: application/json" --data-binary @- \
              "$FLOWBASE_URL/api/ingest/actions-usage"
      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the collector's TypeScript directly.
          node-version: 24
          cache: npm
          cache-dependency-path: flowbase/package-lock.json
      - name: Skip outside the collection window
        id: window
        working-directory: flowbase
        run: |
          hour=$(TZ=America/New_York date +%-H)
          if [ "$hour" -ge 8 ] && [ "$hour" -le 20 ] && [ $(( (hour - 8) % 2 )) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 8am–8pm New York collection slots; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies and Chromium
        if: steps.window.outputs.run == 'true'
        working-directory: flowbase
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Restore saved sessions
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: flowbase/.collector-state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-
      - name: Collect leads
        if: steps.window.outputs.run == 'true'
        working-directory: flowbase
        env:
          FLOWBASE_URL: ${{ secrets.FLOWBASE_URL }}
          INGEST_TOKEN_LEADS: ${{ secrets.INGEST_TOKEN_LEADS }}
          COLLECTOR_STATE_KEY: ${{ secrets.COLLECTOR_STATE_KEY }}
          COLLECTOR_BARK_BASE_URL: ${{ secrets.COLLECTOR_BARK_BASE_URL }}
          COLLECTOR_BARK_USERNAME: ${{ secrets.COLLECTOR_BARK_USERNAME }}
          COLLECTOR_BARK_PASSWORD: ${{ secrets.COLLECTOR_BARK_PASSWORD }}
          COLLECTOR_PERFECT_VENUE_BASE_URL: ${{ secrets.COLLECTOR_PERFECT_VENUE_BASE_URL }}
          COLLECTOR_PERFECT_VENUE_USERNAME: ${{ secrets.COLLECTOR_PERFECT_VENUE_USERNAME }}
          COLLECTOR_PERFECT_VENUE_PASSWORD: ${{ secrets.COLLECTOR_PERFECT_VENUE_PASSWORD }}
          COLLECTOR_WEDDINGPRO_BASE_URL: ${{ secrets.COLLECTOR_WEDDINGPRO_BASE_URL }}
          COLLECTOR_WEDDINGPRO_USERNAME: ${{ secrets.COLLECTOR_WEDDINGPRO_USERNAME }}
          COLLECTOR_WEDDINGPRO_PASSWORD: ${{ secrets.COLLECTOR_WEDDINGPRO_PASSWORD }}
          COLLECTOR_EVENTECTIVE_BASE_URL: ${{ secrets.COLLECTOR_EVENTECTIVE_BASE_URL }}
          COLLECTOR_EVENTECTIVE_USERNAME: ${{ secrets.COLLECTOR_EVENTECTIVE_USERNAME }}
          COLLECTOR_EVENTECTIVE_PASSWORD: ${{ secrets.COLLECTOR_EVENTECTIVE_PASSWORD }}
        run: node collector/src/main.ts ${{ github.event_name == 'workflow_dispatch' && '--any-time' || '' }}
      - name: Save sessions
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: flowbase/.collector-state
          key: collector-state-${{ github.run_id }}
      # Screenshots and HTML hold client details: kept 3 days, only on failure.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.window.outputs.run == 'true'
        with:
          name: collector-failures
          path: flowbase/collector-artifacts/
          retention-days: 3
          if-no-files-found: ignore
