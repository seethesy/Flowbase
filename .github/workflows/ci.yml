name: Platform quality
on:
  pull_request:
    # ready_for_review: a draft PR marked ready runs the full Playwright suite (FLOW-315).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# FLOW-285: independent jobs run in parallel and Playwright is sharded, so a PR
# takes about as long as its slowest job. `ci-ok` is the single required check.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      specs: ${{ steps.select.outputs.specs }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # FLOW-315: a draft PR runs the smoke specs plus the areas it changed; a PR
      # that is ready for review (and a manual run) runs every spec; Markdown,
      # docs and unit/DB-test-only changes run none (scripts/select-e2e.mjs).
      - name: Choose the Playwright specs
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/select-e2e.mjs >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check-links
      # `build` type-checks the app and the Worker before bundling, so CI no
      # longer runs `typecheck` / `typecheck:worker` separately.
      - run: npm run build
      - name: Enforce SPA chunk budget
        run: node scripts/check-bundle-size.mjs

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:worker

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flowbase_ci
          POSTGRES_USER: flowbase
          POSTGRES_PASSWORD: flowbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowbase -d flowbase_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://flowbase:flowbase@localhost:5432/flowbase_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run test:db
      # FLOW-182: a second run on the same database, in shuffled file order, keeps
      # the suite re-runnable and order-independent.
      - run: npm run test:db -- --sequence.shuffle.files
      - name: Verify development seed command
        run: npm run db:seed

  e2e:
    needs: changes
    if: needs.changes.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    # Each shard has its own database and its own `wrangler dev`, so the
    # one-database / one-Worker assumption in playwright.config.ts holds per shard.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flowbase_ci
          POSTGRES_USER: flowbase
          POSTGRES_PASSWORD: flowbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowbase -d flowbase_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://flowbase:flowbase@localhost:5432/flowbase_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The test Worker serves `dist/`. Type checks already run in `static`.
      - name: Build the SPA for the test Worker
        run: npx vite build
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium, WebKit and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: |
          # The runner's Azure mirror can stall long enough to exhaust this job.
          echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          npx playwright install --with-deps chromium webkit
      - name: Install system dependencies for cached browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: |
          echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          npx playwright install-deps chromium webkit
      # FLOW-286: the `mobile` project is not run in CI for now. SPECS is empty for
      # the full suite; --pass-with-no-tests covers a project with no selected spec.
      - name: Playwright desktop and webkit-offline, shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SPECS: ${{ needs.changes.outputs.specs }}
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --pass-with-no-tests $SPECS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  ci-ok:
    needs: [changes, static, unit, db, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const needs = JSON.parse(process.env.RESULTS);
          const bad = Object.entries(needs).filter(([, job]) => !['success', 'skipped'].includes(job.result));
          for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
          if (bad.length) {
            console.log(`::error::Failed or cancelled: ${bad.map(([name]) => name).join(', ')}`);
            process.exit(1);
          }
          JS
