<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Catering inquiry</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; padding: 16px; color: #1f2933; background: #fff; }
      form { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
      label { display: grid; gap: 4px; font-size: 0.9rem; font-weight: 600; }
      input, select, textarea { font: inherit; padding: 10px; border: 1px solid #9aa5b1; border-radius: 6px; }
      .row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 6px; background: #1f5f4a; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      .hint { font-weight: 400; color: #52606d; font-size: 0.8rem; margin: 0; }
      .error { color: #b42318; margin: 0; }
      .thanks { max-width: 560px; margin: 24px auto; text-align: center; }
      /* The honeypot: off-screen for people, still in the page for bots. */
      .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="inquiry" novalidate>
      <h1>Tell us about your event</h1>
      <p id="error" class="error" role="alert" hidden></p>
      <label>Your name *<input name="name" autocomplete="name" required /></label>
      <div class="row">
        <label>Email<input name="email" type="email" autocomplete="email" /></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel" /></label>
      </div>
      <p class="hint">Please give us an email or a phone number so we can reach you.</p>
      <div class="row">
        <label>Event date<input name="eventDate" type="date" /></label>
        <label>Number of guests<input name="guestCount" inputmode="numeric" /></label>
      </div>
      <div class="row">
        <label>Type of event<input name="eventType" placeholder="Wedding, corporate, party…" /></label>
        <label>Event location<input name="location" placeholder="City or venue" /></label>
      </div>
      <label>Anything else we should know?<textarea name="message" rows="4"></textarea></label>
      <div class="trap" aria-hidden="true">
        <label>Company<input name="company" tabindex="-1" autocomplete="off" /></label>
      </div>
      <button type="submit" id="send">Send inquiry</button>
    </form>
    <div id="thanks" class="thanks" role="status" hidden>
      <h1>Thank you</h1>
      <p>We received your inquiry and will be in touch soon.</p>
    </div>
    <script>
      // One id per submission: a retry after an error names the same submission,
      // so it can never create a second lead.
      var submissionId = crypto.randomUUID();
      var form = document.getElementById("inquiry");
      var error = document.getElementById("error");
      var send = document.getElementById("send");
      var show = function (message) {
        error.textContent = message;
        error.hidden = !message;
      };
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var field = function (name) {
          return form.elements[name].value.trim();
        };
        var guests = field("guestCount");
        if (!field("name")) return show("Enter your name.");
        if (!field("email") && !field("phone"))
          return show("Enter an email address or phone number.");
        if (guests && !/^\d+$/.test(guests)) return show("Guests must be a whole number.");
        show("");
        send.disabled = true;
        fetch("/api/ingest/website", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            submissionId: submissionId,
            name: field("name"),
            email: field("email"),
            phone: field("phone"),
            eventDate: field("eventDate"),
            guestCount: guests ? Number(guests) : null,
            location: field("location"),
            eventType: field("eventType"),
            message: field("message"),
            company: form.elements.company.value,
          }),
        })
          .then(function (response) {
            if (response.ok) {
              form.hidden = true;
              document.getElementById("thanks").hidden = false;
              return;
            }
            return response.json().then(
              function (body) {
                show(
                  response.status === 429
                    ? "We have received several inquiries from you already. Please try again later."
                    : (body.error && body.error.message) || "Something went wrong. Please try again.",
                );
              },
              function () {
                show("Something went wrong. Please try again.");
              },
            );
          })
          .catch(function () {
            show("We couldn't send your inquiry. Check your connection and try again.");
          })
          .then(function () {
            send.disabled = false;
          });
      });
    </script>
  </body>
</html>
